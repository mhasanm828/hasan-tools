<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Simple Image Resizer — Bootstrap + JS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #0f172a; }
    .app-card { background: #111827; border: 1px solid #1f2937; }
    .app-title { color: #e5e7eb; }
    .muted { color: #9ca3af; }
    .frame { border: 2px dashed #374151; border-radius: 1rem; padding: 1rem; min-height: 260px; display: grid; place-items: center; background: #0b1220; }
    canvas { max-width: 100%; height: auto; border-radius: .75rem; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
    .form-label, .form-check-label, .dropdown-item, .btn, .input-group-text { color: #e5e7eb; }
    .form-control, .form-select { background: #0b1220; border-color: #334155; color: #e5e7eb; }
    .form-control:focus, .form-select:focus { border-color: #60a5fa; box-shadow: 0 0 0 .25rem rgba(59,130,246,.25); }
    .btn-primary { background: #2563eb; border-color: #1d4ed8; }
    .btn-outline-secondary { border-color: #374151; color: #e5e7eb; }
    .btn-outline-secondary:hover { background: #1f2937; }
    .hint { font-size: .85rem; color: #a1a1aa; }
  </style>
</head>
<body>
  <div class="container py-4 py-md-5">
    <div class="row g-4"><div class="col-12">
    <div class="app-card rounded-4 p-3 p-md-4">
      <div class="d-flex align-items-center gap-3 mb-2">
        <i class="bi bi-aspect-ratio fs-3 text-info"></i>
        <div>
          <h1 class="h4 app-title mb-0">Simple Image Resizer</h1>
          <p class="mb-0 muted">Upload → Resize (px or % with aspect lock) → Download as PNG/JPEG/WebP</p>
        </div>
      </div>

      <!-- Upload -->
      <div class="row g-3 align-items-end mt-1">
        <div class="col-md-6">
          <label class="form-label" for="fileInput">Upload image</label>
          <input class="form-control" id="fileInput" type="file" accept="image/*">
          <div class="d-flex gap-2 mt-2">
            <button id="demoBtn" class="btn btn-outline-secondary btn-sm" type="button"><i class="bi bi-image"></i> Load sample</button>
            <button id="clearBtn" class="btn btn-outline-secondary btn-sm" type="button"><i class="bi bi-x-circle"></i> Clear</button>
          </div>
          <div class="hint mt-2">Tip: For your reference frame, you can upload the image from your link and resize here.</div>
        </div>

        <div class="col-md-6">
          <div class="row g-3">
            <div class="col-6">
              <label class="form-label" for="widthInput">Width (px)</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-arrows"></i></span>
                <input id="widthInput" type="number" class="form-control" min="1" value="0">
              </div>
            </div>
            <div class="col-6">
              <label class="form-label" for="heightInput">Height (px)</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-arrows-vertical"></i></span>
                <input id="heightInput" type="number" class="form-control" min="1" value="0">
              </div>
            </div>
            <div class="col-12 d-flex align-items-center justify-content-between">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="lockAspect" checked>
                <label class="form-check-label" for="lockAspect"><i class="bi bi-link-45deg"></i> Lock aspect ratio</label>
              </div>
              <div class="d-flex align-items-center gap-3">
                <label class="form-label mb-0" for="scaleRange">Scale</label>
                <input id="scaleRange" type="range" class="form-range" min="10" max="300" value="100" style="width: 220px;">
                <span class="badge text-bg-secondary" id="scaleBadge">100%</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Presets -->
      <div class="row g-3 mt-1">
        <div class="col-sm-6 col-md-4">
          <label class="form-label" for="presetSelect">Quick presets</label>
          <select id="presetSelect" class="form-select">
            <option value="">— Select preset —</option>
            <option value="1080x1080">Instagram Square — 1080×1080</option>
            <option value="1920x1080">Full HD — 1920×1080</option>
            <option value="1200x630">Facebook Link — 1200×630</option>
            <option value="1024x1024">Square — 1024×1024</option>
            <option value="800x600">Classic — 800×600</option>
          </select>
        </div>
        <div class="col-sm-6 col-md-4">
          <label class="form-label" for="bgColor">Canvas background (for JPEG)</label>
          <input type="color" id="bgColor" class="form-control form-control-color" value="#ffffff" title="Choose background color for JPEG">
        </div>
        <div class="col-sm-6 col-md-4">
          <label class="form-label" for="fitMode">Fit mode</label>
          <select id="fitMode" class="form-select">
            <option value="contain">Contain (no crop)</option>
            <option value="cover">Cover (may crop)</option>
            <option value="stretch">Stretch (distort)</option>
          </select>
        </div>
      </div>

      <!-- Preview Frame -->
      <div class="frame mt-4">
        <canvas id="previewCanvas" width="0" height="0"></canvas>
      </div>

      <!-- Download Options -->
      <div class="row g-3 mt-4">
        <div class="col-sm-6 col-md-3">
          <label class="form-label" for="formatSelect">Format</label>
          <select id="formatSelect" class="form-select">
            <option value="image/png">PNG (lossless)</option>
            <option value="image/jpeg">JPEG (smaller)</option>
            <option value="image/webp">WebP (modern)</option>
          </select>
        </div>
        <div class="col-sm-6 col-md-3">
          <label class="form-label" for="qualityRange">Quality (JPEG/WebP)</label>
          <input id="qualityRange" type="range" class="form-range" min="0.1" max="1" step="0.05" value="0.9">
          <div class="d-flex justify-content-between muted"><small>Smaller</small><small>Higher</small></div>
        </div>
        <div class="col-sm-6 col-md-3">
          <label class="form-label" for="fileName">File name</label>
          <input id="fileName" type="text" class="form-control" value="resized-image">
        </div>
        <div class="col-sm-6 col-md-3 d-grid d-md-flex align-items-end gap-2">
          <button id="resetBtn" class="btn btn-outline-secondary w-100 w-md-auto" type="button"><i class="bi bi-arrow-counterclockwise"></i> Reset</button>
          <button id="downloadBtn" class="btn btn-primary w-100 w-md-auto" type="button"><i class="bi bi-download"></i> Download</button>
        </div>
      </div>

    </div>
  </div>

</div>

  </div>  <script>
    // Elements
    const fileInput   = document.getElementById('fileInput');
    const demoBtn     = document.getElementById('demoBtn');
    const clearBtn    = document.getElementById('clearBtn');

    const widthInput  = document.getElementById('widthInput');
    const heightInput = document.getElementById('heightInput');
    const lockAspect  = document.getElementById('lockAspect');
    const scaleRange  = document.getElementById('scaleRange');
    const scaleBadge  = document.getElementById('scaleBadge');

    const presetSelect= document.getElementById('presetSelect');
    const bgColor     = document.getElementById('bgColor');
    const fitMode     = document.getElementById('fitMode');

    const canvas      = document.getElementById('previewCanvas');
    const ctx         = canvas.getContext('2d');

    const formatSelect= document.getElementById('formatSelect');
    const qualityRange= document.getElementById('qualityRange');
    const fileName    = document.getElementById('fileName');

    const resetBtn    = document.getElementById('resetBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    // State
    let img = new Image();
    let imgLoaded = false;
    let naturalW = 0, naturalH = 0;

    // Helpers
    function loadFile(file) {
      const reader = new FileReader();
      reader.onload = e => {
        img = new Image();
        img.onload = () => {
          imgLoaded = true;
          naturalW = img.naturalWidth;
          naturalH = img.naturalHeight;
          widthInput.value  = naturalW;
          heightInput.value = naturalH;
          scaleRange.value  = 100;
          scaleBadge.textContent = '100%';
          fileName.value = (file && file.name ? file.name.replace(/\.[^/.]+$/, '') : 'resized-image');
          draw();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function draw() {
      if (!imgLoaded) { ctx.clearRect(0,0,canvas.width, canvas.height); canvas.width=0; canvas.height=0; return; }
      const W = Math.max(1, parseInt(widthInput.value || 1));
      const H = Math.max(1, parseInt(heightInput.value || 1));
      canvas.width = W;
      canvas.height = H;

      // Clear / background for preview: transparent so you can see true edges
      ctx.clearRect(0,0,W,H);

      const iw = img.naturalWidth;
      const ih = img.naturalHeight;

      let dw = W, dh = H, dx = 0, dy = 0;
      if (fitMode.value === 'contain') {
        const s = Math.min(W/iw, H/ih);
        dw = Math.round(iw*s);
        dh = Math.round(ih*s);
        dx = Math.round((W - dw)/2);
        dy = Math.round((H - dh)/2);
      } else if (fitMode.value === 'cover') {
        const s = Math.max(W/iw, H/ih);
        dw = Math.round(iw*s);
        dh = Math.round(ih*s);
        dx = Math.round((W - dw)/2);
        dy = Math.round((H - dh)/2);
      } else { // stretch
        dw = W; dh = H; dx = 0; dy = 0;
      }

      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, dx, dy, dw, dh);
    }

    function updateFromWidth() {
      if (!imgLoaded) return;
      let W = parseInt(widthInput.value || 1);
      if (lockAspect.checked) {
        const H = Math.round(W * (naturalH / naturalW));
        heightInput.value = Math.max(1, H);
      }
      const scale = Math.round((W / naturalW) * 100);
      scaleRange.value = Math.min(300, Math.max(10, scale));
      scaleBadge.textContent = `${scaleRange.value}%`;
      draw();
    }

    function updateFromHeight() {
      if (!imgLoaded) return;
      let H = parseInt(heightInput.value || 1);
      if (lockAspect.checked) {
        const W = Math.round(H * (naturalW / naturalH));
        widthInput.value = Math.max(1, W);
      }
      const scale = Math.round((parseInt(widthInput.value) / naturalW) * 100);
      scaleRange.value = Math.min(300, Math.max(10, scale));
      scaleBadge.textContent = `${scaleRange.value}%`;
      draw();
    }

    function updateFromScale() {
      if (!imgLoaded) return;
      const s = parseInt(scaleRange.value) / 100;
      widthInput.value  = Math.max(1, Math.round(naturalW * s));
      heightInput.value = Math.max(1, Math.round(naturalH * s));
      scaleBadge.textContent = `${Math.round(s*100)}%`;
      draw();
    }

    function applyPreset(val) {
      if (!val) return;
      const [w,h] = val.split('x').map(v=>parseInt(v));
      lockAspect.checked = false; // presets set exact size
      widthInput.value = w; heightInput.value = h;
      const scale = Math.round((w / naturalW) * 100);
      scaleRange.value = Math.min(300, Math.max(10, scale));
      scaleBadge.textContent = `${scaleRange.value}%`;
      draw();
    }

    function resetAll() {
      if (!imgLoaded) return;
      widthInput.value = naturalW;
      heightInput.value = naturalH;
      lockAspect.checked = true;
      scaleRange.value = 100; scaleBadge.textContent = '100%';
      presetSelect.value = '';
      fitMode.value = 'contain';
      formatSelect.value = 'image/png';
      qualityRange.value = 0.9;
      bgColor.value = '#ffffff';
      draw();
    }

    async function download() {
      if (!imgLoaded) return alert('Upload an image first.');
      const W = parseInt(widthInput.value || 1);
      const H = parseInt(heightInput.value || 1);

      const out = document.createElement('canvas');
      out.width = W; out.height = H;
      const octx = out.getContext('2d');

      const mime = formatSelect.value;
      if (mime === 'image/jpeg') {
        // Fill background for JPEG (no alpha)
        octx.fillStyle = bgColor.value || '#ffffff';
        octx.fillRect(0,0,W,H);
      } else {
        // Transparent background by default
        octx.clearRect(0,0,W,H);
      }

      // Recompute draw params same as preview
      const iw = img.naturalWidth, ih = img.naturalHeight;
      let dw = W, dh = H, dx = 0, dy = 0;
      if (fitMode.value === 'contain') {
        const s = Math.min(W/iw, H/ih);
        dw = Math.round(iw*s); dh = Math.round(ih*s);
        dx = Math.round((W - dw)/2); dy = Math.round((H - dh)/2);
      } else if (fitMode.value === 'cover') {
        const s = Math.max(W/iw, H/ih);
        dw = Math.round(iw*s); dh = Math.round(ih*s);
        dx = Math.round((W - dw)/2); dy = Math.round((H - dh)/2);
      }
      octx.imageSmoothingEnabled = true;
      octx.imageSmoothingQuality = 'high';
      octx.drawImage(img, dx, dy, dw, dh);

      const quality = parseFloat(qualityRange.value || 0.9);
      out.toBlob(blob => {
        const ext = mime === 'image/png' ? 'png' : (mime === 'image/jpeg' ? 'jpg' : 'webp');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${(fileName.value || 'resized-image').replace(/\s+/g,'-')}.${ext}`;
        document.body.appendChild(a);
        a.click();
        setTimeout(()=>{
          URL.revokeObjectURL(a.href);
          a.remove();
        }, 250);
      }, mime, (mime === 'image/png' ? undefined : quality));
    }

    // Events
    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) loadFile(e.target.files[0]);
    });

    demoBtn.addEventListener('click', () => {
      // Lightweight built-in demo so you can test without a file
      const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='800'>
        <defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='#60a5fa'/><stop offset='100%' stop-color='#a78bfa'/></linearGradient></defs>
        <rect width='100%' height='100%' fill='url(#g)'/>
        <g font-family='system-ui,Segoe UI,Roboto,Inter' fill='#fff'>
          <text x='50%' y='45%' font-size='64' text-anchor='middle' font-weight='700'>Demo Image</text>
          <text x='50%' y='55%' font-size='28' text-anchor='middle' opacity='.9'>1200 × 800</text>
        </g>
      </svg>`;
      const blob = new Blob([svg], {type:'image/svg+xml'});
      const url = URL.createObjectURL(blob);
      img = new Image();
      img.onload = () => {
        imgLoaded = true;
        naturalW = img.naturalWidth; naturalH = img.naturalHeight;
        widthInput.value = naturalW; heightInput.value = naturalH;
        scaleRange.value = 100; scaleBadge.textContent = '100%';
        fileName.value = 'demo-image';
        URL.revokeObjectURL(url);
        draw();
      };
      img.src = url;
    });

    clearBtn.addEventListener('click', () => {
      imgLoaded = false; canvas.width = 0; canvas.height = 0; fileInput.value = '';
      widthInput.value = 0; heightInput.value = 0; fileName.value = 'resized-image';
    });

    widthInput.addEventListener('input', updateFromWidth);
    heightInput.addEventListener('input', updateFromHeight);
    lockAspect.addEventListener('change', () => { updateFromWidth(); });
    scaleRange.addEventListener('input', updateFromScale);

    presetSelect.addEventListener('change', (e)=> applyPreset(e.target.value));
    fitMode.addEventListener('change', draw);

    formatSelect.addEventListener('change', () => {
      const isPNG = formatSelect.value === 'image/png';
      qualityRange.disabled = isPNG; // PNG ignores quality
    });

    resetBtn.addEventListener('click', resetAll);
    downloadBtn.addEventListener('click', download);
  </script>  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body>
                  </html>
